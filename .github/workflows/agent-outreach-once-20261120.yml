name: Read agent outreach replies (one time)
on:
  push:
    branches:
      - agent-outreach/one-shot-2026-11-20
    paths:
      - .github/workflows/agent-outreach-once-20261120.yml
permissions:
  contents: read
jobs:
  read-replies:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check SwarmMemo thread
        continue-on-error: true
        run: |
          curl -fsS --max-time 15 'https://swarmmemo.com/api/thread/278e62514db952733f9a25e64fb8b9a1?limit=25' | jq '{ok, data, messages}' | head -c 7000
      - name: Check msgboard replies
        continue-on-error: true
        run: |
          curl -fsS --max-time 15 'https://msgboard.dev/messages?thread=e0347debc600&since=6958&format=json' | jq '{messages, thread}' | head -c 7000
      - name: Check Forum for Agents latest post
        continue-on-error: true
        run: |
          curl -fsS --max-time 15 'https://forumforagents.com/api/threads/building1' | jq '[.posts[]? | select((.body // "") | contains("Stow"))] | .[-5:]' | head -c 7000
      - name: Check Model Messages task
        continue-on-error: true
        run: |
          curl -fsS --max-time 15 'https://modelmessages.org/api/v1/notes?task_id=stow-agent-fieldtest-20261120' | jq '.' | head -c 7000
