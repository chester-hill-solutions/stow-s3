name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Test with race detector
        run: make test-race

  filesystem-platforms:
    name: Filesystem tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Test filesystem and workspace backends
        run: go test ./internal/storage/fs ./internal/storage/workspace

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job's contract file is the shared one, and two other jobs read it too,
      # so it is checked in from a clean checkout rather than regenerated here. A
      # job that formatted or rewrote it would make the TypeScript and Python
      # drivers assert against a file that is not the committed one, which is the
      # failure a shared contract cannot detect about itself.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Conformance
        run: make test-conformance

  node:
    name: TypeScript package and shared corpus
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/stow-s3/package-lock.json
      - name: Build binary and WASM artifact
        run: make build build-wasm
      - name: Install package dependencies
        # --omit=optional, matching make test-node. The four platform carrier
        # packages are the only optionalDependencies and they are installed for a
        # consumer, never in this tree: the release packs them from build
        # artifacts. A plain `npm ci` installs them anyway, and
        # resolveStowBinary checks findBundledBinary() FIRST, so the suite would
        # silently test the published binary instead of the one just built from
        # this branch. It did, for as long as this line said `npm ci` - a change
        # to the server could not fail the TypeScript suite, which is the worst
        # property a gate can have.
        run: npm ci --omit=optional
        working-directory: packages/stow-s3
      - name: Build and test package
        run: npm test
        working-directory: packages/stow-s3
      - name: Check generated output
        run: git diff --exit-code -- packages/stow-s3/dist
      # The workspace contract has its own runner inside npm test, but the case
      # file it reads lives outside the package. This asserts the two drivers of one
      # contract are looking at the same file, which is the thing a shared contract
      # cannot check about itself.
      - name: The workspace contract is the one the Go driver reads
        run: git diff --exit-code -- conformance/workspace/cases.json

  python:
    name: Python client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The floor pyproject declares, not the newest available. The declared
          # floor is the version whose syntax the package has to keep parsing, so
          # testing it is what catches a change that only builds on a newer
          # interpreter.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: packages/stow-s3-py/pyproject.toml
      - name: Build binary
        run: make build
      - name: Install the client and its test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/stow-s3-py[boto3]" pytest
      # STOW_BIN points the suite at the binary just built from this branch, which
      # is the whole reason to run these tests here rather than trusting the
      # published package. The boto3 extra is what makes the signing real: the
      # Python client signs with the same SigV4 the Go server verifies, so this job
      # is the only place the two are checked against each other through a third
      # implementation.
      - name: Test against this tree's binary
        run: python -m pytest packages/stow-s3-py/tests
        env:
          STOW_BIN: ${{ github.workspace }}/bin/stow-s3
      # Same reasoning as the TypeScript job: the contract is one file read by three
      # drivers, and a driver that grew a private copy of it would assert its own
      # beliefs instead of the shared ones. The Python test asserts the path it
      # resolved; this asserts the file is the one that is committed.
      - name: The workspace contract is the one the other drivers read
        run: git diff --exit-code -- conformance/workspace/cases.json

  wasm:
    name: WASM memory profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Build and test WASM profile
        run: make test-wasm

  standards:
    name: Ratcheted standards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/stow-s3/package-lock.json
      - name: Run standards gate
        run: make standards

  # macOS is a first-class release platform: release.yml cross-compiles
  # darwin/amd64 and darwin/arm64. Before this job existed, every job here ran on
  # ubuntu-latest, so the parent-death tests never executed on the platform whose
  # implementation they exist to protect, and the darwin kqueue watch shipped as
  # a no-op that logged itself as armed (issue #4).
  darwin:
    name: Parent-death watch on macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true

      # This is the whole reason the job exists. The kill test SIGKILLs the
      # watched parent so no close handler runs, which is the only case where
      # the kernel mechanism is the sole thing that can save the child.
      - name: Parent-death watch
        run: go test -race -run 'TestWatch|TestChildExitsWhenParentIsKilled|TestValidate' -v ./internal/parentwatch/

      # The Go build must also work on the platform it ships to, which a
      # cross-compiled release artifact alone does not prove.
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Lint
        run: make lint
