<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stow bucket browser</title>
<style>body{margin:0;font:14px system-ui;background:var(--color-background-primary,#fff);color:var(--color-text-primary,#172020)}#legacy-app{padding:20px}#legacy-app header{display:flex;justify-content:space-between;align-items:center}#legacy-app h1{font-size:20px;margin:0 0 18px}#legacy-app form{display:flex;gap:8px;align-items:center}#legacy-app input[type=text]{flex:1;min-width:60px}#legacy-app main{display:grid;grid-template-columns:minmax(200px,1fr) minmax(220px,1fr);gap:20px}#legacy-app ul{padding:0;list-style:none;max-height:65vh;overflow:auto}#legacy-app li{display:flex;align-items:center;border-bottom:1px solid var(--color-border-primary,#ddd);padding:8px 0;gap:10px}#legacy-app .object{flex:1;overflow-wrap:anywhere;text-align:left;background:transparent;border:0;color:inherit;padding:8px;cursor:pointer}#legacy-app pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto;padding:14px;border:1px solid var(--color-border-primary,#ddd);border-radius:10px}#legacy-app #status{min-height:42px;line-height:1.5;font-size:13px;color:var(--color-text-secondary,#555)}@media(max-width:600px){#legacy-app main{grid-template-columns:1fr}}</style>
<!-- SDK_STYLE --><!-- WORKSPACE_STYLE --></head><body><div id="workspace-root" hidden></div><div id="legacy-app"><header><h1>Stow · <span id="bucket">Bucket browser</span></h1><span>Read-only browser</span></header>
<form id="search"><label for="prefix">Key prefix</label><input class="form-control" type="text" id="prefix" maxlength="1024" autocomplete="off"><button class="btn btn-primary cursor-interaction" type="submit">Browse</button></form>
<p id="status" role="status" aria-live="polite">Connecting to Stow…</p><main><section><ul id="objects" aria-label="Objects"></ul><button class="btn cursor-interaction" id="next" type="button" disabled>Next page</button></section><section><pre id="preview">Choose an object to preview its contents.</pre></section></main></div>
<!-- SDK_SCRIPT --></body></html>
